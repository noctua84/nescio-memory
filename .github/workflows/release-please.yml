name: release-please

# On merge to main, release-please reads the conventional commits since the last
# release and maintains a "release PR" that bumps the version (pyproject.toml) and
# updates CHANGELOG.md. Merging that release PR tags the commit and publishes a
# GitHub Release.
#
# This uses a personal access token rather than GITHUB_TOKEN on purpose. Under
# GITHUB_TOKEN the release PR is authored by the github-actions bot, and GitHub
# holds that author's pull_request workflow runs in "action_required" until a
# maintainer approves them — so ci.yml and openapi.yml never actually ran on the
# release PR, and every release merged unvalidated. A PAT belonging to an account
# with write access makes the PR author a trusted contributor, so those runs start
# on their own.
#
# Prerequisite (one-time): repository secret RELEASE_PLEASE_TOKEN holding a
# fine-grained PAT scoped to this repository with Contents and Pull requests both
# set to Read and write. The "Allow GitHub Actions to create and approve pull
# requests" setting is no longer needed, since the PAT rather than GITHUB_TOKEN
# creates the PR.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA rather than a tag. This matters more here than
      # elsewhere: it is the one action handed a write-scoped PAT.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
