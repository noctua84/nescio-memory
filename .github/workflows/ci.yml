name: ci

# Enforces that uv.lock is the single source of truth for dependencies.
#
# `uv sync --locked` fails if uv.lock is out of date with pyproject.toml, which
# catches the common drift case: someone adds a dependency (or edits a version
# constraint) without re-running `uv lock`. Use `--frozen` instead only if you
# want to install from the lock WITHOUT that staleness check.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deps:
    name: deps (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor and current, per requires-python = ">=3.12"
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      # Actions are pinned to commit SHAs rather than tags, so a retagged or
      # compromised release cannot redirect a workflow. Dependabot's
      # github-actions ecosystem updates the SHA and the version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies (fails if uv.lock is stale)
        run: uv sync --locked --no-build --python ${{ matrix.python-version }}

      - name: Import check
        run: |
          uv run --locked --no-build --python ${{ matrix.python-version }} python -c "
          import fastapi, uvicorn, psycopg, pgvector, langfuse, httpx, pydantic, pydantic_settings
          print('all runtime dependencies import OK')
          "

      # The local-embeddings extra is opt-in, so no other CI step exercises it.
      # --dry-run resolves it against the lockfile without downloading torch,
      # which is enough to catch a constraint that has rotted.
      - name: Verify the local-embeddings extra resolves
        run: uv sync --locked --no-build --extra local-embeddings --dry-run --python ${{ matrix.python-version }}

  tests:
    name: tests (py3.12)
    runs-on: ubuntu-latest
    # The suite completes in well under a minute; 15 is generous headroom for a
    # cold image pull. Without a bound, a test that hangs on real network I/O --
    # the documented failure mode for a mis-targeted embedding patch -- would run
    # against GitHub's 360-minute default.
    timeout-minutes: 15
    # Tests run against a real PostgreSQL + pgvector container that
    # testcontainers starts and stops itself, so there is no `services:` block
    # and no Docker setup step -- the Docker daemon is pre-installed on hosted
    # Ubuntu runners. This job must stay on ubuntu-latest: macOS and Windows
    # hosted runners cannot run Linux containers.
    #
    # Single Python version by design. The floor is where version-specific
    # breakage shows up, and the deps job above already proves 3.12, 3.13 and
    # 3.14 all resolve and import. Three legs here would mean three container
    # pulls per push for no additional signal.
    env:
      # secrets is not available in a step-level `if:`, so surface it here and
      # gate on env instead. Without this the guard silently does nothing.
      # Named DOCKERHUB_NAME to match the repository secret that exists.
      DOCKERHUB_NAME: ${{ secrets.DOCKERHUB_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Anonymous Docker Hub pulls are rate limited per IP, and GitHub's hosted
      # runners share egress addresses, so an unauthenticated pull of
      # pgvector/pgvector and testcontainers' Ryuk reaper fails intermittently
      # with toomanyrequests. Authenticating raises the limit substantially.
      #
      # The step is skipped when the secret is absent, so forks without it still
      # run the suite -- they simply keep the anonymous rate limit.
      - name: Docker Hub login
        if: env.DOCKERHUB_NAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_NAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true

      # --no-build forbids building sdists, so no package's setup.py/pyproject
      # build hook can run as a side effect of the install. Safe here because
      # every dependency in uv.lock ships a wheel; an sdist-only addition would
      # fail this step loudly instead of silently running its build script.
      - name: Install dependencies (fails if uv.lock is stale)
        run: uv sync --locked --no-build --python 3.12

      - name: Run tests
        run: uv run --locked --no-build --python 3.12 pytest
