name: OpenAPI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: openapi-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  openapi-checks:
    name: Generate, Validate, Lint & Drift-Check
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to commit SHAs rather than tags, so a retagged or
      # compromised release cannot redirect a workflow. Dependabot's
      # github-actions ecosystem updates the SHA and the version comment together.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # setup-uv handles uv itself plus dependency caching.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      # --locked fails if uv.lock is stale, matching your existing lock-check philosophy.
      # --no-build forbids building sdists, so no package's setup.py/pyproject
      # build hook can run as a side effect of the install. Safe here because
      # every dependency in uv.lock ships a wheel; an sdist-only addition would
      # fail this step loudly instead of silently running its build script.
      - name: Install dependencies
        run: uv sync --locked --no-build --group dev

      # Generate the spec from the actual code.
      # Dummy env vars satisfy Settings() without a real DB —
      # app.openapi() only reads routes + Pydantic models.
      # `uv run` is required: uv sync populates .venv but does not activate it,
      # so a bare `python` would resolve to the setup-python interpreter.
      - name: Generate OpenAPI spec from code
        env:
          DATABASE_URL: postgresql+psycopg://dummy:dummy@localhost:5432/dummy
          OLLAMA_URL: http://localhost:11434/api/embeddings
        run: uv run --locked --no-build python export_openapi.py

      # 1. Structural validation — is this a valid OpenAPI document?
      - name: Validate OpenAPI schema
        run: uv run --locked --no-build openapi-spec-validator openapi.json

      # 2. Drift detection — does the committed spec match the code?
      - name: Check for spec drift
        run: |
          if git diff --exit-code openapi.json openapi.yaml; then
            echo "✅ OpenAPI spec is up to date with the code."
          else
            echo "::error::OpenAPI spec is out of date!"
            echo "Run 'uv run python export_openapi.py' locally and commit the result."
            git diff openapi.json openapi.yaml
            exit 1
          fi

      # 3. Spectral linting — is this a *good* spec by our conventions?
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"

      # Pinned to an exact version rather than implicit @latest, so a new
      # release can't change lint behaviour (or supply-chain risk) underneath
      # this workflow without a deliberate bump. --ignore-scripts stops any
      # package in the dependency tree from running an install-time lifecycle
      # script; spectral-cli needs none of its own, verified by running
      # `spectral lint` against this repo's openapi.json after installing
      # with the flag.
      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli@6.17.0 --ignore-scripts

      - name: Lint OpenAPI spec with Spectral
        run: spectral lint openapi.json --ruleset .spectral.yaml
