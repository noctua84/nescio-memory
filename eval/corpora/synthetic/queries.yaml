# Query set for the synthetic fixture corpus.
#
# HOW TO ADD A CASE
# -----------------
# Append an entry to `queries:` with four fields:
#
#   - id:            short, unique, stable. Referenced in reports.
#     query:         the question, phrased as a person would actually type it.
#     expect_notes:  one or more note ids. A note id is the file's path
#                    relative to the corpus root, e.g. "invoice-rounding.md".
#                    An id that is not in the corpus is a FATAL error, not a
#                    zero score -- see eval/queries.py for why.
#     why:           one line on why that note is the right answer. This is for
#                    the next person, who will want to know whether a case is
#                    wrong or the retrieval is.
#
# Then re-run: `uv run python -m eval`
#
# HOW TO KEEP THIS SET HONEST
# ---------------------------
# A query set built only from note titles measures nothing except whether the
# title was indexed, and it hands the `summary` strategy a win it has not
# earned. A set built only from obscure details buried deep in bodies does the
# mirror-image favour to `chunk`. This set deliberately mixes three kinds, and
# the `kind` comment on each group says which:
#
#   topic   - asks for the subject of a note in different words. Both
#             strategies should do well.
#   buried  - asks about a specific fact that appears once, well inside a body,
#             and is NOT mentioned in the name or description. This is the case
#             summary-indexing is expected to struggle with, and the reason the
#             ADR 0005 claim needs measuring rather than asserting.
#   oblique - describes a symptom or a situation without naming the mechanism,
#             which is how people actually search. Neither strategy has an
#             obvious advantage.
#
# If you add cases, add them across all three. Skewing the mix is how this
# harness produces a confident wrong answer.

queries:
  # kind: topic
  - id: pool-sizing
    query: how many database connections will we actually open across all our pods
    expect_notes: [postgres-connection-pooling.md]
    why: The note's whole subject is per-pod versus per-cluster connection arithmetic.

  - id: retention-how-long
    query: how long do we keep transaction records and request logs
    expect_notes: [data-retention-windows.md]
    why: Both windows are stated explicitly; this is the note's primary purpose.

  - id: rollout-stages
    query: what percentages do we roll a change out in and how long do we wait between them
    expect_notes: [feature-flag-rollout.md]
    why: The stage ladder and soak times are the note's headline content.

  - id: escalate-when
    query: how long should I work on an incident before waking someone else up
    expect_notes: [oncall-escalation.md]
    why: The thirty minute ceiling and the permission to escalate early are the point of the note.

  - id: idempotency-basics
    query: how do we make it safe for a client to retry a payment request
    expect_notes: [idempotency-keys.md]
    why: Client-supplied keys on retryable writes is the note's subject.

  # kind: buried
  - id: multipart-leak
    query: we are being billed for storage that does not show up in any object listing
    expect_notes: [object-storage-lifecycle.md]
    why: >-
      Abandoned multipart upload parts are the answer, and they appear only in
      the body -- neither the name nor the description mentions listings or
      invisible bytes directly.

  - id: bankers-rounding
    query: should we round half to even or half away from zero
    expect_notes: [invoice-rounding.md]
    why: Rounding mode is one paragraph deep in the body; the description does not mention it.

  - id: refresh-race
    query: two refresh calls raced each other and the user got logged out
    expect_notes: [session-token-expiry.md]
    why: The ten second grace window for concurrent refresh is a single body paragraph.

  - id: flag-hash-key
    query: why do two independent experiments at the same percentage pick the same users
    expect_notes: [feature-flag-rollout.md]
    why: >-
      Hashing the subject together with the flag key is stated only in the
      bucketing paragraph, and the correlation consequence only there.

  - id: midnight-dates
    query: a birthday shifted by a day for some users
    expect_notes: [timestamp-storage.md]
    why: >-
      The plain-date rule is near the end of the body. This note also has no
      description at all, so the summary strategy has only its name to work
      with -- exactly the case worth measuring.

  - id: lockfile-copy
    query: our build reinstalls every dependency when we change one line of source
    expect_notes: [container-build-cache.md]
    why: Layer ordering and the narrow manifest copy are body content.

  - id: deletion-missed-systems
    query: which systems do we forget when erasing someone's data
    expect_notes: [data-retention-windows.md]
    why: >-
      The analytics warehouse and third-party processors are named as the
      consistently-missed ones only in the body checklist.

  - id: restore-reapply
    query: we restored from a backup, what do we have to redo
    expect_notes: [data-retention-windows.md]
    why: The deletion-journal replay rule is one sentence in the body.

  # kind: oblique
  - id: throughput-collapse
    query: consumers look healthy and busy but lag is climbing and nothing is being processed
    expect_notes: [consumer-group-rebalance.md]
    why: Describes the rebalance-loop symptom without naming rebalancing.

  - id: thundering-herd
    query: the origin database falls over every time a popular cached value expires
    expect_notes: [cache-stampede-mitigation.md]
    why: Describes the stampede by its effect rather than its name.

  - id: short-results
    query: search returns three results when we asked for ten and there is no error
    expect_notes: [vector-index-recall.md]
    why: The post-filter short-result-set symptom, described as a user would report it.

  - id: stuck-pipeline
    query: the deploy job died halfway and now nobody else can apply anything
    expect_notes: [terraform-state-locking.md]
    why: A stale lock after a killed CI job, described as the situation rather than the mechanism.

  - id: idle-memory-growth
    query: memory keeps growing all day but traffic is flat and we cannot find a leak
    expect_notes: [postgres-connection-pooling.md]
    why: >-
      Idle backends holding work memory is the cause, and the note explicitly
      frames it as a misdiagnosed application leak.

  # Multi-note cases: more than one note is a legitimate answer, so recall is
  # scored against the set. These are where a single-note-per-query set gives a
  # misleadingly harsh number.
  - id: cache-invalidation-variants
    query: how do we avoid serving one variant of a change to users in the other group
    expect_notes: [feature-flag-rollout.md, cache-stampede-mitigation.md]
    why: >-
      Flag bucketing covers cache keying across variants; the cache note covers
      serving stale values. Either is a defensible answer.

  - id: retry-safety
    query: what has to be true for it to be safe to retry an operation automatically
    expect_notes: [idempotency-keys.md, consumer-group-rebalance.md]
    why: >-
      Idempotency keys for client writes, and handler idempotency after a
      rebalance reprocesses a batch. Both are genuinely on topic.
