# SonarCloud CI-based analysis (see .github/workflows/ci.yml, job "test").
# Automatic Analysis must be OFF in the SonarCloud project settings: it cannot
# import a coverage report, and running both makes the CI scan fail.
sonar.organization=noctua84
sonar.projectKey=noctua84_nescio-memory

sonar.sources=app,scripts
sonar.tests=tests
sonar.python.version=3.12

# Written by `pytest --cov --cov-report=xml` in the test job.
sonar.python.coverage.reportPaths=coverage.xml
