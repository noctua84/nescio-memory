[project]
name = "nescio-memory"
version = "0.1.0"
description = "Semantic memory API: chunk, embed and retrieve knowledge using PostgreSQL and pgvector."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Markus Moeller", email = "markus.moeller@outlook.de" },
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langfuse==4.15.4",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.0.1",
    "uvicorn==0.53.0",
]

[project.urls]
Repository = "https://github.com/noctua84/nescio-memory"
Issues = "https://github.com/noctua84/nescio-memory/issues"
