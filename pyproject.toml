[project]
name = "nescio-memory"
version = "0.3.1"
description = "Semantic memory API: chunk, embed and retrieve knowledge using PostgreSQL and pgvector."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Markus Moeller", email = "markus.moeller@outlook.de" },
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langfuse==4.15.6",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.2.10",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.0",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
# In-process embeddings via sentence-transformers instead of the Ollama HTTP
# backend. Opt-in because it pulls torch (~530 MB of wheels on Linux):
#   uv sync --extra local-embeddings
local-embeddings = [
    "sentence-transformers==6.1.0",
]

[dependency-groups]
dev = [
    "openapi-spec-validator>=0.9.0",
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "testcontainers[postgres]>=4.15.0",
]

[project.urls]
Repository = "https://github.com/noctua84/nescio-memory"
Issues = "https://github.com/noctua84/nescio-memory/issues"

[tool.pytest.ini_options]
# pythonpath puts the repo root on sys.path so `app.*` and `tests.*` both
# import regardless of the directory pytest was invoked from. alembic.ini's
# prepend_sys_path = "." relies on the same assumption.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
